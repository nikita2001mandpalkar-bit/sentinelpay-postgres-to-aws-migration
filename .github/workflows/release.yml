name: SentinelPay Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate release candidate
        run: |
          python -m compileall -q src airflow/dags
          python -m pytest -q

      - name: Package source release
        run: git archive --format=tar.gz --output=sentinelpay-release-${{ github.sha }}.tar.gz ${{ github.sha }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelpay-release-${{ github.sha }}
          path: sentinelpay-release-${{ github.sha }}.tar.gz
          retention-days: 7
