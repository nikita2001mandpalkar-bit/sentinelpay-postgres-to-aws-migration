services:
  postgres:
    image: postgres:16
    container_name: sentinelpay-legacy-postgres
    environment:
      POSTGRES_DB: sentinelpay_legacy
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: sentinelpay_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelpay -d sentinelpay_legacy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: